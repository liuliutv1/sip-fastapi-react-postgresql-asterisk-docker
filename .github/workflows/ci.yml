name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: callcenter_test
          POSTGRES_USER: callcenter
          POSTGRES_PASSWORD: callcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callcenter -d callcenter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://callcenter:callcenter@localhost:5432/callcenter_test
      DATABASE_URL: postgresql+psycopg://callcenter:callcenter@localhost:5432/callcenter_test
      ASTERISK_AMI_EVENT_LISTENER_ENABLED: "false"
      SIP_TRUNK_HEALTH_CHECK_ENABLED: "false"
      RECORDINGS_LOCAL_DIR: ${{ github.workspace }}/backend/.test-recordings
      ASTERISK_RECORDINGS_DIR: ${{ github.workspace }}/backend/.test-recordings
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests with detailed logs
        working-directory: backend
        run: pytest --log-cli-level=INFO

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-validation-contract:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Shell validation script syntax
        run: |
          bash -n scripts/post_deploy_validate.sh
          bash -n scripts/deploy_aliyun.sh
          bash -n scripts/check_sip_deploy.sh
